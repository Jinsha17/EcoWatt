
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoWatt - Electricity Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ EcoWatt</h1>
        <p>Smart Electricity Consumption Predictor</p>

        <form id="prediction-form">
            <label>Current consumption (kWh)</label>
            <input id="consumption" type="number" min="0" max="100"
                   step="0.01" value="2.5" required>

            <label>Hour (0-23)</label>
            <input id="hour" type="number" min="0" max="23"
                   value="18" required>

            <label>Day of week (0=Monday, 6=Sunday)</label>
            <input id="day" type="number" min="0" max="6"
                   value="2" required>

            <label>Tariff per kWh (₹)</label>
            <input id="tariff" type="number" min="0.01" max="100"
                   step="0.01" value="8" required>

            <button type="submit">Predict Consumption</button>
        </form>

        <div id="result" hidden>
            <h2>Prediction Result</h2>
            <p>Next-hour consumption: <strong id="usage"></strong></p>
            <p>Estimated cost: <strong id="cost"></strong></p>
        </div>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
