
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecowatt-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ecowatt-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
